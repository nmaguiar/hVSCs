ojob:
  async       : true
  opacks      :
  - openaf: 20220822
  - oJob-common
  catch       : if (isDef(exception.javaException)) exception.javaException.printStackTrace(); else printErr(exception)
  logToConsole: true   # to change when finished
  argsFromEnvs: true
  numThreads  : 6

jobs:
- name: Report
  type: shutdown
  to  : ojob report

# ============================
- name : Set SSH user password
  exec : |
    if (isDef(getEnv("SSH_PASS"))) {
      log("Setting SSH user password...")
      $sh("echo \"user:$SSH_PASS\" | sudo chpasswd")
      .prefix("chpasswd")
      .exec()
    }

# =======================
- name : Start SSH daemon
  from :
  - Set SSH user password
  lang : shell
  exec : |
    {{#if NOSSH}}
    echo SSH not started
    {{else}}
    sudo service ssh start
    {{/if}}

# ===================
- name : Start docker
  lang : shell
  exec : |
    {{#if NODOCKER}}
    echo Docker not started
    {{else}}
    sudo update-alternatives --set iptables /usr/sbin/iptables-legacy
    sudo sed -i 's/^\(\s*\)ulimit -Hn 524288/\1# ulimit -Hn 524288/' /etc/init.d/docker
    echo updated
    if ! sudo service docker start; then
      echo "service docker start failed, trying dockerd fallback..."
      sudo mkdir -p /var/log
      sudo /bin/sh -c "nohup dockerd --storage-driver=vfs >/var/log/dockerd.log 2>&1 &"
    fi
    {{/if}}

# -------------------------------
- name : Wait for Docker to start
  exec : |
    var ec
    do {
      sleep(1000, true)
      ec = $sh("docker version").get(0).exitcode
    } while(ec != 0)
    log("Docker is ready")

# ================
- name : Start K3D
  from : Wait for Docker to start
  lang : shell
  exec : |
    {{#if NOK8S}}
      echo K8S not started
    {{else}}
      echo K3D creating
      echo creating > /tmp/.kube
      K3S_VERSION=$(k3d version list k3s -o raw -l 1 2>/dev/null)
      if [ -z "$K3S_VERSION" ]; then
        echo "Could not determine latest k3s version, using k3d default"
        K3S_IMAGE_ARG=""
      else
        echo "Using latest k3s version: $K3S_VERSION"
        K3S_IMAGE_ARG="--image rancher/k3s:$K3S_VERSION"
      fi
      {{#if NOPUBLIC}}
      k3d cluster create --k3s-arg "--snapshotter=native@server:*" $K3S_IMAGE_ARG --registry-create registry:5000 -p "127.0.0.1:1080:1080@loadbalancer"
      {{else}}
      k3d cluster create --k3s-arg "--snapshotter=native@server:*" $K3S_IMAGE_ARG --registry-create registry:5000 -p "0.0.0.0:1080:1080@loadbalancer"
      {{/if}}
      echo created > /tmp/.kube
      echo K3D creation end
    {{/if}}

# =============================
- name : Start K3D socks server
  deps :
  - Start K3D
  lang : shell
  exec : |
    #!/usr/bin/env bash

    {{#if NOK8S}}
    {{#if NODOCKER}}{{else}}
    docker run --rm -d -p 1080:1080 nmaguiar/socksd 
    {{/if}}
    {{else}}
    while (! kubectl version --output=json > /dev/null 2>&1 ); do
      sleep 1
    done

    /usr/bin/ojob ojob.io/kube/genSocksServer | kubectl -n kube-system apply -f - 
    kubectl expose -n kube-system deploy socks-server --type=LoadBalancer
    #while [[ $(kubectl get pods -n kube-system -l app=socks-server -o 'jsonpath={..status.conditions[?(@.type=="Ready")].status}') != "True" ]]; do
    #  sleep 2
    #done
    {{/if}}
