# Author: Nuno Aguiar
# Installs the bundled VSCode extensions into code-server. Run synchronously,
# before code-server starts, so extensions are present on the first load
# (code-server's --install-extension CLI has no IPC hook into an already
# running server, unlike the openvscode-server remote-cli it replaced).
todo:
- Install VSCode extensions

ojob:
  opacks      :
  - openaf: 20220822
  - oJob-common
  catch       : if (isDef(exception.javaException)) exception.javaException.printStackTrace(); else printErr(exception)
  logToConsole: true
  argsFromEnvs: true

jobs:
- name : Install VSCode extensions
  catch: sprintErr(exception)
  exec : |
    if (isDef(getEnv("NOVSCODE"))) return

    var lst2 = io.readFileYAML("/tmp/.extensions/extensions.yaml").extensions

    var lst = $from(lst2.map(r => ({ n: r })))
              .attach("f", r => $from(io.listFiles("/tmp/.extensions").files).starts("filename", r.n).at(0))
              .select()

    $from(lst)
    .ends("f.filename", ".vsix")
    .select(f => {
      if (isDef(args.NOK8S) && f.n.indexOf("kubernetes") >= 0) return
      if (isDef(args.NODOCKER) && (f.n.indexOf("docker") >= 0 || f.n.indexOf("container") >= 0)) return
      log("installing extension " + f.f.filename + "...")
      $sh("code-server --install-extension " + f.f.canonicalPath + " --force --user-data-dir /home/openvscode-server/.local/share/code-server --extensions-dir /home/openvscode-server/.local/share/code-server/extensions")
      .prefix("code-server")
      .exec(0)
    })
